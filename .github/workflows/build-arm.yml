name: Build ARM
run-name: ${{ github.actor }} triggered "Build ARM"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'The deployment environment (prod)'
        required: true
        type: string
      version:
        description: 'The version deployed (x.x.x)'
        required: true
        type: string

permissions:
  contents: read

jobs:        
  build:
    runs-on: ubuntu-24.04-arm
    steps:
    - name: Checkout code in the runner
      uses: actions/checkout@v6

    - name: Build the rust solver
      run: rustc src/Service/Apad/solver.rs -o apad-solver -O   

    - name: Upload build
      uses: actions/upload-artifact@v7
      with:
        name: apad-solver-${{ inputs.version }}
        path: apad-solver
        arrchive: false
